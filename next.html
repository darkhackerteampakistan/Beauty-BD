<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ধন্যবাদ — BeautyBD সার্ভে</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#fffbf6;--paper:#fff;--ink:#2a1a14;--muted:#8a7468;
    --line:#f0e5d8;--primary:#e0396e;--primary-soft:#fdeef4;
    --gold:#d4a55a;--green:#10b981;
  }
  html,body{height:100%;}
  body{
    font-family:'Hind Siliguri','Inter',sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:30px 20px;
    position:relative;overflow:hidden;
  }
  body::before{content:"";position:absolute;top:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(224,57,110,0.08),transparent 70%);}
  body::after{content:"";position:absolute;bottom:-100px;left:-100px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(212,165,90,0.08),transparent 70%);}

  .card{
    position:relative;z-index:2;
    max-width:520px;width:100%;
    background:var(--paper);border-radius:24px;
    padding:56px 44px;text-align:center;
    box-shadow:0 30px 80px rgba(42,26,20,0.10);
    border:1px solid var(--line);
  }

  .icon{
    width:100px;height:100px;margin:0 auto 26px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--green),#059669);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 20px 50px rgba(16,185,129,0.35);
    animation:pop .7s cubic-bezier(0.2,0.9,0.3,1.3);
  }
  .icon svg{width:50px;height:50px;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}65%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}

  .tag{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 16px;
    background:#ecfdf5;color:var(--green);
    border-radius:999px;
    font-size:12.5px;font-weight:600;
    margin-bottom:18px;
  }
  .tag::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:var(--green);
  }

  h1{font-size:32px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;margin-bottom:14px;}
  h1 span{color:var(--primary);}

  p{
    font-size:15.5px;line-height:1.7;color:var(--muted);
    margin-bottom:32px;max-width:380px;margin-left:auto;margin-right:auto;
  }

  .meta{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:14px;padding:24px 0 0;
    border-top:1px solid var(--line);
  }
  .meta-item .v{font-size:22px;font-weight:700;color:var(--primary);margin-bottom:5px;}
  .meta-item .k{font-size:11.5px;color:var(--muted);font-weight:500;}

  .footnote{
    margin-top:26px;padding-top:20px;
    border-top:1px solid var(--line);
    font-size:12.5px;color:var(--muted);
  }
  .footnote::after{content:"…";animation:dots 1.5s infinite;}
  @keyframes dots{0%{content:".";}33%{content:"..";}66%{content:"...";}100%{content:".";}}

  @media (max-width:520px){
    .card{padding:40px 24px;}
    h1{font-size:24px;}
    .meta{grid-template-columns:1fr;gap:16px;}
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="tag">সফলভাবে জমা হয়েছে</div>
  <h1>ধন্যবাদ, <span>অংশগ্রহণের</span> জন্য!</h1>
  <p>
    আপনার দোকানের তথ্য আমরা পেয়েছি। আমাদের টিম খুব শীঘ্রই আপনার সাথে
    যোগাযোগ করতে পারে।
  </p>

  <div class="meta">
    <div class="meta-item"><div class="v">✓</div><div class="k">তথ্য জমা</div></div>
    <div class="meta-item"><div class="v">24h</div><div class="k">যোগাযোগ</div></div>
    <div class="meta-item"><div class="v">100%</div><div
